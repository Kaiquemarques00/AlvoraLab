    <linearGradient id="azul-direito" x1="627" y1="472" x2="720" y2="643" gradientUnits="userSpaceOnUse"><stop stop-color="#6379FF"/><stop offset="1" stop-color="#3654FF"/></linearGradient>
    <linearGradient id="azul-base" x1="628" y1="589" x2="628" y2="643" gradientUnits="userSpaceOnUse"><stop stop-color="#1026D7"/><stop offset="1" stop-color="#0818B7"/></linearGradient>
