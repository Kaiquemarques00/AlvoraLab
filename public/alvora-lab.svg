  <title>Alvora Lab — logo vetorial sem fundo</title>
  <desc>Reconstrução vetorial da referência. Triângulos com faces independentes, letras em curvas individuais e linhas laterais separadas. Sem imagem raster e sem círculo de fundo.</desc>
