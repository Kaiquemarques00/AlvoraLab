    <linearGradient id="prata-direita" x1="677" y1="255" x2="865" y2="626" gradientUnits="userSpaceOnUse"><stop stop-color="#E9EBF3"/><stop offset="0.6" stop-color="#D8DBE5"/><stop offset="1" stop-color="#E9EAF0"/></linearGradient>
    <linearGradient id="prata-topo" x1="628" y1="233" x2="628" y2="326" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F1F8"/></linearGradient>
    <linearGradient id="bisel-esquerdo" x1="615" y1="344" x2="450" y2="645" gradientUnits="userSpaceOnUse"><stop stop-color="#777D90"/><stop offset="0.6" stop-color="#4D598B"/><stop offset="1" stop-color="#363C53"/></linearGradient>
